<body>
    <div class="invitation-card">
        <div class="header">
            <img src="couple-photo.jpg" alt="合照" class="couple-photo">
        </div>

        <div class="content">
            <div class="invitation-text">
                <p class="greeting">良辰吉日，佳期已定</p>
                <p class="main-info">谨于2026年9月27日（星期六）17:30</p>
                <p class="location">在<span class="location-highlight">杭州望湖宾馆</span>8楼望湖厅</p>
                <p class="greeting">举办婚宴，恭候光临</p>
            </div>

            <h2 class="form-title">出席回执</h2>

            <form id="weddingForm" action="https://formsubmit.co/124646037@qq.com" method="POST" target="hidden_iframe" onsubmit="submitForm()">
                <input type="hidden" name="_subject" value="婚礼回执 - 有新宾客啦！">
                <input type="hidden" name="_template" value="table">

                <div class="form-group">
                    <label class="form-label">是否出席<span class="required">*</span></label>
                    <div class="attendance-options">
                        <button type="button" class="attendance-btn active" data-value="欣然出席" onclick="selectAttendance(this)">欣然出席</button>
                        <button type="button" class="attendance-btn" data-value="遗憾缺席" onclick="selectAttendance(this)">遗憾缺席</button>
                    </div>
                    <input type="radio" name="是否出席" id="attend_yes" value="欣然出席" checked style="display:none;">
                    <input type="radio" name="是否出席" id="attend_no" value="遗憾缺席" style="display:none;">
                </div>

                <div class="form-group">
                    <label class="form-label">您的姓名<span class="required">*</span></label>
                    <input type="text" name="姓名" class="form-input" placeholder="请输入您的姓名" required>
                </div>

                <div class="form-group">
                    <label class="form-label">参席人数<span class="required">*</span></label>
                    <div class="guest-counter">
                        <button type="button" class="counter-btn" onclick="changeCount(-1)" id="minusBtn">−</button>
                        <div class="counter-value" id="guestCount">1</div>
                        <button type="button" class="counter-btn" onclick="changeCount(1)">+</button>
                    </div>
                    <input type="hidden" name="出席人数" id="guestCountInput" value="1">
                </div>

                <button type="submit" class="submit-btn">提交回执</button>
            </form>
        </div>

        <div class="footer">
            <div class="names">吴浩浩<span class="heart">❤</span>曹怡</div>
            <div class="message">期待您的到来</div>
        </div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <div class="success-overlay" id="successOverlay">
        <div class="success-modal">
            <div class="success-icon">💌</div>
            <div class="success-title">回执已提交</div>
            <div class="success-text">感谢您的回复<br>我们期待与您共享这份喜悦</div>
        </div>
    </div>

    <script>
        let guestCount = 1;

        function selectAttendance(btn) {
            document.querySelectorAll('.attendance-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const value = btn.dataset.value;
            if (value === '欣然出席') {
                document.getElementById('attend_yes').checked = true;
                document.getElementById('attend_no').checked = false;
            } else {
                document.getElementById('attend_yes').checked = false;
                document.getElementById('attend_no').checked = true;
            }
        }

        function changeCount(delta) {
            guestCount = Math.max(1, Math.min(10, guestCount + delta));
            document.getElementById('guestCount').textContent = guestCount;
            document.getElementById('guestCountInput').value = guestCount;
            document.getElementById('minusBtn').disabled = guestCount <= 1;
        }

        function submitForm() {
            document.getElementById('successOverlay').classList.add('show');
            setTimeout(() => {
                document.getElementById('successOverlay').classList.remove('show');
            }, 3000);
            setTimeout(() => {
                resetForm();
            }, 500);
        }

        function resetForm() {
            document.getElementById('weddingForm').reset();
            guestCount = 1;
            document.getElementById('guestCount').textContent = '1';
            document.getElementById('guestCountInput').value = '1';
            document.getElementById('minusBtn').disabled = false;
            document.querySelectorAll('.attendance-btn').forEach((b, i) => {
                b.classList.toggle('active', i === 0);
            });
            document.getElementById('attend_yes').checked = true;
            document.getElementById('attend_no').checked = false;
        }
    </script>
